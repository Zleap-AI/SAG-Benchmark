[project]
name = "sag-benchmark"
version = "0.1.0"
description = "SAG2 and Agentic SAG2 implementations and reproducible retrieval evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "jieba==0.42.1",
    "pyuca==1.2",
    "python-dotenv>=1.0",
    "regex>=2024.0",
    "tiktoken>=0.12",
]

[dependency-groups]
dev = ["pytest>=9", "ruff==0.15.12"]
local = ["torch>=2.6,<3", "transformers>=4.51,<6", "safetensors>=0.4"]
local-mlx = ["mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
