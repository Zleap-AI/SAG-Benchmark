[project]
name = "lightrag-sag"
version = "0.1.0"
description = "LightRAG — running against a deployed OpenAI-compatible LLM/embedding endpoint (no local model download)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.0",
    "tiktoken>=0.5",
    "tenacity>=8.0",
    "aiohttp>=3.9",
    "numpy>=1.24",
    "nano-vectordb>=0.0.1",
    "networkx>=3.0",
    "graspologic>=3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "configparser>=5.0",
    "pipmaster>=0.1",
    "tqdm>=4.65",
    "httpx",
    "igraph>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightrag"]
