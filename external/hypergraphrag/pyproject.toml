[project]
name = "hypergraphrag"
version = "1.0.6"
description = "HyperGraphRAG — running against an already-deployed OpenAI-compatible LLM/embedding endpoint (no local model download)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Zirui Guo" }]

# ---------------------------------------------------------------------------
# Only what is needed to import the package and call a remote OpenAI-compatible
# endpoint for both LLM and embedding. Local model loading deps (torch,
# transformers, accelerate, lmdeploy, ollama, aioboto3, zhipuai) are NOT here —
# those code paths import them lazily and will raise a clear ImportError only
# if you actually switch to them.
# ---------------------------------------------------------------------------
dependencies = [
    # --- LLM / embedding client (talks to your deployed endpoint) ---
    "openai>=1.0",          # AsyncOpenAI client + base_url to your endpoint
    "tiktoken>=0.5",        # token counting (utils.Encoder)
    "tenacity>=8.0",        # retry decorators on API calls
    # --- async HTTP for the optional jina/siliconcloud embedding helpers ---
    "aiohttp>=3.9",
    # --- core data / vector / graph (default NanoVectorDB + NetworkX) ---
    "numpy>=1.24",
    "nano-vectordb>=0.0.1",
    "networkx>=3.0",
    "graspologic>=3.0",     # used in storage.py (lazy, but small enough to ship)
    # --- misc runtime ---
    "pydantic>=2.0",
    "tqdm>=4.65",
    "igraph>=1.0.0",
]

[project.optional-dependencies]
# Install ONLY if you switch a backend on. None of these are required for the
# default OpenAI-compatible API path.
ollama = ["ollama>=0.1"]
hf = ["torch", "transformers", "accelerate"]
lmdeploy = ["lmdeploy"]
bedrock = ["aioboto3"]
zhipu = ["zhipuai"]
# remote graph/vector stores (default uses in-process NanoVectorDB + NetworkX)
neo4j = ["neo4j"]
milvus = ["pymilvus"]
mongo = ["pymongo"]
tidb = ["sqlalchemy"]
oracle = ["oracledb"]
chroma = ["chromadb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypergraphrag"]

[tool.uv]
# Keep the resolver off GPU/torch-heavy wheels by default.
package = true
