# 见 pyproject.toml 的 [tool.ruff] / [tool.black] / [tool.mypy] 配置
# 本地首次使用：pre-commit install（安装 git hook），随后每次 commit 自动执行
# 手动全量跑一次：pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: check-git-remote-credentials
        name: check git remote credentials
        entry: uv run python scripts/check_git_remote_credentials.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
