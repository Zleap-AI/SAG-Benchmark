[project]
name = "sag-benchmark"
version = "0.1.0"
description = "数据流智能引擎 - AI驱动的数据处理与聚合检索"
authors = [
    {name = "Zleap Team", email = "contact@zleap.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai", "nlp", "event-extraction", "knowledge-management", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "cryptography>=41.0.0", # Required for MySQL sha256_password/caching_sha2_password auth
    "redis>=5.0.0",
    "aiohttp>=3.9.0",
    "openai>=1.6.0",
    "anthropic>=0.7.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.7.0",
    "elasticsearch==8.19.1",
    "elasticsearch-dsl==8.18.0",
    "numpy>=2.3.4",
    "jieba>=0.42.1",
    "psutil>=7.1.1",
    "aiofiles>=25.1.0",
    "minio>=7.2.18",
    "oss2>=2.19.1",
    # FastAPI for API server
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
    "python-multipart>=0.0.6", # for file uploads
    "pandas>=2.3.3",
    "alembic>=1.17.0",
    "spacy>=3.8.7",
    "rank-bm25>=0.2.2",
    "rouge-score>=0.1.2",
    "pillow>=12.0.0",
    "markitdown[all]>=0.0.1a4",
    "mlflow>=3.7.0",
    "python-louvain>=0.16",
    "networkx>=3.5",
    "tokenizers>=0.22.2",
    "json-repair>=0.58.4",
    # 任务队列
    "aio-pika>=9.4.0",
    "igraph>=1.0.0",
    "jsonschema>=4.26.0",
    "setuptools<70",  # Required for pkg_resources (graspologic dependency)
]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
    "numpy==2.3.4",
    "jieba==0.42.1",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

api = [
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module level import not at top of file（scripts 里 sys.path.insert 后 import 的合法模式）
    "E712",  # == True 比较（SQLAlchemy / ORM 过滤表达式必须用 ==，不能改 is）
    "E741",  # ambiguous variable name
    "B008",  # do not perform function calls in argument defaults
    "B901",  # return value in generator
    "B904",  # raise from（项目内自定义异常体系不强制 from 链，避免大面积改动）
    "B905",  # zip() without strict=（项目内 zip 均为已知等长序列，逐个加 strict 风险大于收益）
    "C901",  # too complex
    "UP042", # class X(str, Enum) -> StrEnum（破坏性重构，影响序列化/Pydantic，暂不迁移）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# 前向引用字符串注解 + 循环变量与 import 同名等 ruff 误报
"pipeline/core/ai/factory.py" = ["F821"]
"pipeline/modules/search/multi_vector.py" = ["F402"]
# pipeline 基类/抽象方法采用空方法 + 子类覆盖的约定，不强制 @abstractmethod
"pipeline/core/ai/base.py" = ["B027"]
"pipeline/core/storage/repositories/base.py" = ["B024"]

[tool.pytest.ini_options]
# External projects are validated in their shared graph runtime. Keep the root
# default suite scoped to the pipeline's own tests and dependencies.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "aiomysql.*",
    "elasticsearch.*",
    "redis.*",
    "tiktoken.*",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",  # 允许在日志中使用 f-string
    "too-few-public-methods",         # 允许单方法类（如 EventExtractor, EventProcessor）
    "broad-exception-caught",         # 允许捕获通用异常（批处理容错）
    "no-member",                      # Pydantic Field(default_factory) 的误报
]

[tool.pylint.format]
max-line-length = 100  # 与 black/ruff 保持一致

[tool.pylint.typecheck]
# 忽略 Pydantic 模型的动态属性
generated-members = ["pydantic.*"]
ignored-classes = ["pydantic.fields.FieldInfo"]
