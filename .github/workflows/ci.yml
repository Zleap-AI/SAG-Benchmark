name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Git remote credential guard
        run: uv run python scripts/check_git_remote_credentials.py

      - name: Ruff（lint + 格式检查）
        run: uv run ruff check .

      - name: Black 格式检查
        run: uv run black --check pipeline scripts

      - name: 语法/导入编译检查
        run: uv run python -m compileall -q pipeline scripts
